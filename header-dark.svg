<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="390" viewBox="0 0 1280 390" role="img" aria-labelledby="title desc">
  <title id="title">Hutchie — Backend-focused developer</title>
  <desc id="desc">Editorial GitHub profile header for Hutchie with balanced emphasis on Laravel, Django, Python, and PHP.</desc>
  <defs>
