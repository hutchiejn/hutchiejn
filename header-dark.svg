  <rect width="1280" height="390" fill="#0d1117"/>
  <rect x="32" y="24" width="1216" height="342" rx="22" fill="#0f1520" stroke="#273142"/>
  <path d="M64 68H1218" stroke="#273142" stroke-width="1"/>
  <path d="M64 318H1218" stroke="#273142" stroke-width="1"/>
  <path d="M840 68V318" stroke="#273142" stroke-width="1"/>
